name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.0.66). Defaults to the version in the .csproj.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # net462 is one of the target frameworks; it builds on ubuntu via the SDK's
    # reference assemblies. Switch to windows-latest if that ever stops working.
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PACKAGE_PROJECT: SmartTender.Api/SmartTender.Api.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "VERSION_ARG=-p:Version=$VERSION" >> "$GITHUB_ENV"
            echo "Publishing version $VERSION"
          else
            echo "VERSION_ARG=" >> "$GITHUB_ENV"
            echo "Publishing version from $PACKAGE_PROJECT"
          fi

      - name: Restore
        run: dotnet restore smarttender.api.sln

      - name: Build
        run: dotnet build smarttender.api.sln -c Release --no-restore $VERSION_ARG

      - name: Test
        run: dotnet test SmartTender.Api.Tests/SmartTender.Api.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack "$PACKAGE_PROJECT" -c Release --no-build --output artifacts $VERSION_ARG

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Push to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
